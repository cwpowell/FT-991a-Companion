name: Build installers

# Builds the macOS disk images (Apple Silicon and Intel) and the Windows program and installer
# on GitHub's own machines, because each can only be built on its own kind of computer.
#
# Run it from the Actions tab: "Build installers", then "Run workflow".
# Or push a tag such as v1.0.0 to build and draft a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (leave empty to use the one in ft991a_panel.py)"
        required: false
        default: ""
      commit_files:
        description: "Also commit the built files into the MacOS and Windows folders"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple Silicon
            label: apple-silicon
          - os: macos-15-intel      # Intel (GitHub retires Intel Mac runners in fall 2027)
            label: intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version number
        shell: bash
        run: |
          S="$(python3 packaging/version.py)"
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; fi
          V="${V#v}"
          if [ -n "$V" ] && [ "$V" != "$S" ]; then
            echo "::error::The version asked for ($V) is not the one in ft991a_panel.py ($S). Leave the Version box empty, or change __version__ in ft991a_panel.py first."
            exit 1
          fi
          echo "PANEL_VERSION=$S" >> "$GITHUB_ENV"
      - name: Build the app and the disk image
        run: bash packaging/build_macos.sh
      - name: Self-test report
        if: always()
        run: cat "build/selftest-${{ matrix.label }}.txt" || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.label }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version number
        shell: bash
        run: |
          S="$(python3 packaging/version.py)"
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; fi
          V="${V#v}"
          if [ -n "$V" ] && [ "$V" != "$S" ]; then
            echo "::error::The version asked for ($V) is not the one in ft991a_panel.py ($S). Leave the Version box empty, or change __version__ in ft991a_panel.py first."
            exit 1
          fi
          echo "PANEL_VERSION=$S" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build the program and the installer
        shell: cmd
        run: packaging\build_windows.bat
      - name: Self-test report
        if: always()
        shell: bash
        run: cat build/selftest.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/FT-991A-Panel-*.exe      # the program and the installer, both with the version in the name
          if-no-files-found: error

  publish:
    name: Collect the files
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Version number
        run: |
          S="$(python3 packaging/version.py)"
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; fi
          V="${V#v}"
          if [ -n "$V" ] && [ "$V" != "$S" ]; then
            echo "::error::The version asked for ($V) is not the one in ft991a_panel.py ($S). Leave the Version box empty, or change __version__ in ft991a_panel.py first."
            exit 1
          fi
          echo "PANEL_VERSION=$S" >> "$GITHUB_ENV"
      - name: Put the files in the MacOS and Windows folders
        if: github.event_name == 'workflow_dispatch' && inputs.commit_files
        run: |
          set -e
          ls -l artifacts
          mkdir -p MacOS Windows
          git rm -q --ignore-unmatch -- 'MacOS/*.dmg' 'Windows/*.exe'     # only this version stays
          rm -f MacOS/*.dmg Windows/*.exe
          cp artifacts/*.dmg MacOS/
          cp artifacts/*.exe Windows/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MacOS Windows
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add installers for version $PANEL_VERSION"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Draft a release with the files attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$PANEL_VERSION"
          # --target pins the tag to the commit that was built, even if main moves on before you publish
          gh release create "$TAG" artifacts/* --draft --target "$GITHUB_SHA" \
            --title "FT-991A Panel $PANEL_VERSION" \
            --notes "Installers for macOS (Apple Silicon and Intel) and Windows. FT-991A Companion is free software under the GNU General Public License, version 3 or later. The licence is inside each installer, and the source of this version is this repository at this release's tag." \
            || gh release upload "$TAG" artifacts/* --clobber
